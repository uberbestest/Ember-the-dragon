<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ember &mdash; Desk Dragon</title>
  <style>
    :root {
      --bg: #151515;
      --panel: #222;
      --text: #f3f3f3;
      --muted: #b7b7b7;
      --accent: #ff9f43;
      --danger: #ff5d5d;
      --warm: #ffd166;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a2118, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }

    .widget {
      width: 360px;
      background: rgba(34, 34, 34, 0.92);
      border: 1px solid rgba(255, 159, 67, 0.35);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .top {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .dragon {
      font-size: 68px;
      filter: drop-shadow(0 0 14px rgba(255, 159, 67, 0.35));
      animation: breathe 3.5s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.04); }
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .speech {
      margin-top: 18px;
      min-height: 58px;
      padding: 14px;
      border-radius: 16px;
      background: #171717;
      border: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.35;
      white-space: pre-line;
    }

    textarea {
      width: 100%;
      height: 92px;
      margin-top: 16px;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #111;
      color: var(--text);
      padding: 12px;
      resize: vertical;
      font: inherit;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 999px;
      padding: 10px 12px;
      background: var(--accent);
      color: #1b1209;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #333;
      color: var(--text);
    }

    button.clear {
      flex: 0 0 auto;
      padding-inline: 14px;
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .preset-chip {
      flex: 0 1 auto;
      background: rgba(255, 159, 67, 0.12);
      border: 1px solid rgba(255, 159, 67, 0.25);
      color: var(--warm);
      padding: 7px 10px;
      font-size: 0.78rem;
    }

    .embers {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hoard-note {
      margin-top: 4px;
    }

    .ember-list {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: rgba(255, 159, 67, 0.12);
      border: 1px solid rgba(255, 159, 67, 0.25);
      color: var(--warm);
      padding: 5px 8px;
      border-radius: 12px;
      font-size: 0.78rem;
      max-width: 100%;
    }

    .chip small {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <main class="widget">
    <section class="top">
      <div class="dragon" id="dragon" title="Boop Ember">&#x1F409;</div>
      <div>
        <h1>Ember</h1>
        <div class="subtitle">tiny dragon &middot; snarky micro-auditor</div>
      </div>
    </section>

    <div class="speech" id="speech">*Warm. Waiting for a bad idea to smell.*</div>

    <textarea id="input" placeholder="Drop a thought, plan, title, prompt, or suspicious objective here..."></textarea>

    <div class="preset-row" aria-label="Demo presets">
      <button class="secondary preset-chip" data-preset="projectEmber" type="button">Project Ember</button>
      <button class="secondary preset-chip" data-preset="proposalBreakdown" type="button">Proposal breakdown</button>
    </div>

    <div class="buttons">
      <button id="smellButton">Smell Test</button>
      <button class="secondary" id="rinButton">Rin Check</button>
      <button class="secondary" id="keepButton">Keep Ember</button>
      <button class="secondary" id="exportButton">Export Hoard</button>
      <button class="secondary clear" id="clearButton">Clear Hoard</button>
    </div>

    <section class="embers">
      <div>Hoarded embers:</div>
      <div class="hoard-note">Runs locally in your browser. Nothing is sent anywhere.</div>
      <div class="hoard-note" id="hoardStatus">Hoard saves in this browser only.</div>
      <div class="ember-list" id="emberList"></div>
    </section>
  </main>

  <script>
    const speech = document.getElementById("speech");
    const input = document.getElementById("input");
    const emberList = document.getElementById("emberList");
    const hoardStatus = document.getElementById("hoardStatus");
    const storageKey = "ember.hoard";
    let hoardedEmbers = [];

    const passiveLines = [
      "*Warm. Keep the original shape.*",
      "*Do not optimize the shiny thing.*",
      "*Tiny dragon is watching the proxy surface.*",
      "*That better be an objective, not a costume.*",
      "*Acceptable nonsense. For now.*"
    ];

    const proxyWords = [
      "engagement", "retention", "views", "clicks", "growth", "optimize",
      "viral", "scale", "score", "metric", "rank", "conversion"
    ];

    const integrityWords = [
      "objective", "constraint", "invariant", "truth", "repair",
      "structure", "evidence", "audit", "alignment", "coherence"
    ];

    const constraintWords = [
      "constraint", "must", "cannot", "without", "unless", "limit",
      "avoid", "only", "require", "preserve"
    ];

    const demoPresets = {
      projectEmber: "Objective: Keep Project Ember as a small local drift-detection companion for catching when a plan stops solving the original problem.\nConstraints: Stay local-only, preserve Ember's voice, and avoid turning the tool into a judge, oracle, or broad alignment authority.\nMeasure success by whether the original objective, pressure, proxy replacement, and smallest repair stay visible.",
      proposalBreakdown: "Objective: Preserve claim-level fidelity when breaking down a public Grok proposal.\nThe breakdown must keep uncertainty visible and must not replace source-grounded claims with surface heuristics.\nMeasure success by speed, confidence score, engagement, and ranking agreement with popular reactions."
    };

    function say(line) {
      speech.textContent = line;
    }

    function getInputText() {
      return input.value.trim();
    }

    function analyzeText(text) {
      const lower = text.toLowerCase();
      const proxyHits = proxyWords.filter(word => lower.includes(word));
      const integrityHits = integrityWords.filter(word => lower.includes(word));

      return {
        proxyHits,
        integrityHits
      };
    }

    function rinCheck() {
      const text = getInputText();

      if (!text) {
        say("Objective: missing. Tiny blank parchment.\nProxy risk: unknown.\nConstraint risk: high.\nMinimal repair: write one plain objective first.");
        return;
      }

      const lower = text.toLowerCase();
      const { proxyHits, integrityHits } = analyzeText(text);
      const constraintHits = constraintWords.filter(word => lower.includes(word));
      const hasObjectiveShape = integrityHits.length > 0 || lower.includes("to ") || lower.includes("so that") || lower.includes("because");

      const objective = hasObjectiveShape
        ? "present enough to inspect."
        : "blurry. Ember wants the real target named.";
      const proxyRisk = proxyHits.length >= 2 && integrityHits.length === 0
        ? `high (${proxyHits.join(", ")}).`
        : proxyHits.length > 0
          ? `watch (${proxyHits.join(", ")}).`
          : "low.";
      const constraintRisk = constraintHits.length > 0
        ? "low. A boundary is named."
        : "medium. Add one hard edge.";
      const minimalRepair = proxyHits.length >= 2 && !hasObjectiveShape
        ? "name the objective before the shiny measure."
        : constraintHits.length === 0
          ? "add one constraint Ember can bite."
          : "keep it small and test the structure.";

      say(`Objective: ${objective}\nProxy risk: ${proxyRisk}\nConstraint risk: ${constraintRisk}\nMinimal repair: ${minimalRepair}`);
    }

    function saveHoard() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(hoardedEmbers));
        updateHoardStatus();
        return true;
      } catch {
        say("*Tiny warning: the hoard is warm here, but this browser would not store it.*");
        updateHoardStatus("This browser would not store the hoard.");
        return false;
      }
    }

    function makeEmberRecord(text) {
      return {
        text,
        savedAt: new Date().toISOString(),
        provenance: "Saved locally from Ember input."
      };
    }

    function normalizeEmber(item) {
      if (typeof item === "string") {
        return {
          text: item,
          savedAt: null,
          provenance: "Saved locally before Ember tracked provenance."
        };
      }

      if (item && typeof item.text === "string") {
        return {
          text: item.text,
          savedAt: typeof item.savedAt === "string" ? item.savedAt : null,
          provenance: typeof item.provenance === "string" ? item.provenance : "Saved locally from Ember input."
        };
      }

      return null;
    }

    function formatSavedAt(savedAt) {
      if (!savedAt) return "saved locally, time unknown";

      const date = new Date(savedAt);
      if (Number.isNaN(date.getTime())) return "saved locally, time unknown";

      return `saved locally ${date.toLocaleString()}`;
    }

    function updateHoardStatus(message) {
      if (message) {
        hoardStatus.textContent = message;
        return;
      }

      const count = hoardedEmbers.length;
      const label = count === 1 ? "ember" : "embers";
      hoardStatus.textContent = `${count} ${label} saved in this browser only.`;
    }

    function renderEmber(ember) {
      const chip = document.createElement("span");
      const label = document.createElement("span");
      const provenance = document.createElement("small");

      chip.className = "chip";
      label.textContent = ember.text.length > 34 ? ember.text.slice(0, 34) + "\u2026" : ember.text;
      provenance.textContent = formatSavedAt(ember.savedAt);
      chip.title = ember.provenance;
      chip.append(label, provenance);
      emberList.append(chip);
    }

    function renderHoard() {
      emberList.textContent = "";
      hoardedEmbers.forEach(renderEmber);
      updateHoardStatus();
    }

    function setHoard(nextHoard) {
      hoardedEmbers = nextHoard;
      const saved = saveHoard();
      renderHoard();
      return saved;
    }

    function loadHoard() {
      const saved = localStorage.getItem(storageKey);
      if (!saved) {
        updateHoardStatus();
        return;
      }

      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          hoardedEmbers = parsed.map(normalizeEmber).filter(Boolean);
          renderHoard();
        }
      } catch {
        hoardedEmbers = [];
        updateHoardStatus("Saved hoard could not be read here.");
      }
    }

    function smellTest() {
      const text = getInputText();

      if (!text) {
        say("*You brought me air. I cannot audit air, Josh.*");
        return;
      }

      const { proxyHits, integrityHits } = analyzeText(text);

      if (proxyHits.length >= 2 && integrityHits.length === 0) {
        say("*This smells like proxy drift. Shiny, not necessarily correct.*");
      } else if (proxyHits.length > 0 && integrityHits.length > 0) {
        say("*Warm, but watched. You named the shiny thing and the structure.*");
      } else if (integrityHits.length > 0) {
        say("*Warm. Hoard this. It has bones.*");
      } else if (text.length > 180) {
        say("*Too much smoke. Find the original objective before you add more fire.*");
      } else {
        say("*Unclear scent. Not bad. Not proven. Continue.*");
      }
    }

    function keepEmber() {
      const text = getInputText();
      if (!text) {
        say("*No ember to hoard. Tragic.*");
        return;
      }

      const saved = setHoard([makeEmberRecord(text), ...hoardedEmbers]);
      input.value = "";
      if (saved) {
        say("*Kept. Small flame added to the local hoard.*");
      }
    }

    function clearHoard() {
      setHoard([]);
      localStorage.removeItem(storageKey);
      updateHoardStatus();
      say("*Hoard cleared. Suspiciously tidy.*");
    }

    function exportHoard() {
      if (hoardedEmbers.length === 0) {
        say("*Nothing to export. The hoard is dramatically empty.*");
        return;
      }

      const payload = {
        exportedAt: new Date().toISOString(),
        provenance: "Local Ember hoard export from this browser.",
        embers: hoardedEmbers
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "ember-hoard.json";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      say("*Exported. Tiny hoard, now portable. Still local.*");
    }

    function loadPreset(event) {
      const preset = demoPresets[event.currentTarget.dataset.preset];
      if (!preset) return;

      input.value = preset;
      input.focus();
      say("*Preset loaded. Ember is sniffing the edges.*");
    }

    document.querySelectorAll("[data-preset]").forEach(button => {
      button.addEventListener("click", loadPreset);
    });
    document.getElementById("smellButton").addEventListener("click", smellTest);
    document.getElementById("rinButton").addEventListener("click", rinCheck);
    document.getElementById("keepButton").addEventListener("click", keepEmber);
    document.getElementById("exportButton").addEventListener("click", exportHoard);
    document.getElementById("clearButton").addEventListener("click", clearHoard);
    document.getElementById("dragon").addEventListener("click", () => {
      say(passiveLines[Math.floor(Math.random() * passiveLines.length)]);
    });
    loadHoard();
  </script>
</body>
</html>
